<style>

    padding:28px 0 24px;

  }

  }

  .nav-item{

    background:none; border:none; cursor:pointer;
    color:var(--text-muted);
    font-family:'IBM Plex Sans',sans-serif;

    font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:13px; letter-spacing:.08em;
  }

  .tab-btn{

  .tugas-placeholder{

  .chapter-nav-footer{
    margin-top:52px; padding-top:24px; border-top:1px solid var(--steel-line);
    display:flex; justify-content:space-between; gap:16px;
  }
  .chapter-nav-footer a{
    color:var(--text-muted); text-decoration:none; font-size:13.5px;
    font-family:'IBM Plex Mono',monospace;
  }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--steel-line); border-radius:5px; }
</style>
</head>

    html += `<button class="nav-item ${currentView===c.id?'active':''}" data-route="${c.id}">
      <span class="num">${c.num}</span><span>${c.title}</span>
    </button>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll("[data-route]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      navigate(btn.dataset.route);
      document.getElementById("sidebar").classList.remove("mobile-open");
    });
  });
}

function navigate(route){
  currentView = route;
  currentTab = "materi";
  renderNav();
  renderMain();
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderMain(){
  const main = document.getElementById("main");
  if(currentView === "home"){
    main.innerHTML = renderHome();
    main.querySelectorAll(".chapter-card").forEach(card=>{
      card.addEventListener("click", ()=> navigate(card.dataset.id));
    });
    return;
  }
  const chapter = chapters.find(c=>c.id===currentView);
  if(!chapter){ main.innerHTML = renderHome(); return; }
  main.innerHTML = renderChapter(chapter);

  main.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      currentTab = btn.dataset.tab;
      renderMain();
    });
  });
  const prevBtn = main.querySelector("[data-nav='prev']");
  const nextBtn = main.querySelector("[data-nav='next']");
  if(prevBtn) prevBtn.addEventListener("click", ()=> navigate(prevBtn.dataset.id));
  if(nextBtn) nextBtn.addEventListener("click", ()=> navigate(nextBtn.dataset.id));
}

function renderHome(){
  let cards = chapters.map(c=>`
    <div class="chapter-card" data-id="${c.id}">
      <span class="num">Minggu ${parseInt(c.num)} — Bab ${parseInt(c.num)}</span>
      <h3>${c.title}</h3>
      <p>${c.subtitle}</p>
    </div>
  `).join("");
  return `
    <div class="home-hero">
      <div class="eyebrow">Drilling Management · S2 Teknik Perminyakan</div>
      <h1 class="hero-title">Materi Perkuliahan Drilling Management</h1>
      <p class="hero-desc">Portal materi mingguan untuk mata kuliah Drilling Management, Program Magister Teknik Perminyakan, Fakultas Teknologi Mineral, UPN "Veteran" Yogyakarta. Diampu oleh Dr. Ir. Drs. Herianto, M.Sc. dan Prof. Dr. Ir. Aris Buntoro, M.T., IPU. Setiap minggu berisi ringkasan materi dan halaman tugas — daftar akan terus bertambah mengikuti jadwal perkuliahan.</p>
    </div>
    <div class="chapter-grid">${cards}</div>
  `;
}

function renderSection(s){
  if(s.list){
    return `<div class="materi-block"><h4>${s.h}</h4><ul>${s.list.map(li=>`<li>${li}</li>`).join("")}</ul></div>`;
  }
  return `<div class="materi-block"><h4>${s.h}</h4><p>${s.p}</p></div>`;
}

function renderChapter(chapter){
  const idx = chapters.findIndex(c=>c.id===chapter.id);
  const prev = chapters[idx-1];
  const next = chapters[idx+1];

  const materiHtml = `
    ${chapter.sections.map(renderSection).join("")}
    <div class="download-box">
      <div>
        <div class="label">Materi asli dari dosen</div>
        <div class="filename">${chapter.file}</div>
      </div>
      <a class="btn secondary" href="./${chapter.file}" download>Unduh PPT Asli</a>
    </div>
  `;

  const tugasHtml = `
    <div class="tugas-card">
      <span class="tugas-status">Belum ditentukan</span>
      <h4>Tugas Minggu ${parseInt(chapter.num)} — ${chapter.title}</h4>
      <p>Instruksi tugas untuk minggu ini akan disampaikan oleh dosen pengampu saat kelas online berlangsung. Halaman ini sudah disiapkan agar tugas bisa langsung ditambahkan begitu diberikan, tanpa perlu mengubah struktur website.</p>
      <div class="tugas-placeholder">
        Placeholder — ganti bagian ini dengan instruksi tugas resmi (deskripsi tugas, format pengumpulan, dan tenggat waktu) setelah diterima dari dosen.
      </div>
    </div>
  `;

  return `
    <div class="chapter-header">
      <div class="num">Minggu ${parseInt(chapter.num)} · Bab ${parseInt(chapter.num)}</div>
      <h2 class="chapter-title">${chapter.title}</h2>
      <p class="chapter-subtitle">${chapter.subtitle}</p>
    </div>
    <div class="tabs">
      <button class="tab-btn ${currentTab==='materi'?'active':''}" data-tab="materi">Materi</button>
      <button class="tab-btn ${currentTab==='tugas'?'active':''}" data-tab="tugas">Tugas</button>
    </div>
    ${currentTab==='materi' ? materiHtml : tugasHtml}
    <div class="chapter-nav-footer">
      ${prev ? `<a data-nav="prev" data-id="${prev.id}">← Minggu ${parseInt(prev.num)}: ${prev.title}</a>` : `<span></span>`}
      ${next ? `<a data-nav="next" data-id="${next.id}">Minggu ${parseInt(next.num)}: ${next.title} →</a>` : `<span></span>`}
    </div>
  `;
}
